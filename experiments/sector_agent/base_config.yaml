# Base book for the sector-agent experiment. The control arm is exactly this config;
# the agent arm is this config plus the agent's two monthly parameters.
# Changing `forecast` forces new agent inputs and decisions; changing optimizer
# parameters keeps the existing decisions. Simple `key: value` YAML only.

name: c3_sector_2
optimizer: sizing/optimizer
forecast: current_gbm_no8k
predictions: default            # default = sizing/_engine.resolve_predictions(None)
start: 2021-01
end: 2026-08

optimizer_params:               # any field of sizing/optimizer/constraints.Settings; others keep defaults
  sector_limit: 0.02
  cost_penalty: 230             # matched to holdings_final 2021-02 (match_config*.csv); flat optimum 227.5-235

overlay:
  enabled: true
  rule_file: C:/Users/b0079/Desktop/VOL_TARGET_RULE.md
  vol_target: 0.10
  k_min: 0.25
  k_max: 1.00
  hedge_window: 24
  hedge_min: 12
  vol_window: 12
  vol_min: 12
  trading_cost_bps: 65
  borrow_bps_annual: 152

nav_usd: 1000000000
reference_holdings: C:/Users/b0079/Desktop/holdings_final.csv
# true = run the arms even if the control does not reproduce the reference within 1e-4 of
# gross; the gap is reported. Set 2026-10-29 11:54 under the user's 12:05 time rule.
allow_approximate_control: true
